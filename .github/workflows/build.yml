name: Build iOS IPA & Verify

on:
  push:
    branches: [main, master, 'release/**']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ipa:
    name: Build Keeper .ipa (macOS)
    runs-on: macos-14
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Select Xcode Version & Platform
        run: |
          echo "Available Xcode installations:"
          ls -d /Applications/Xcode* || true
          
          # Test each Xcode to find one that has the iOS runtime installed
          SELECTED_XCODE=""
          for xc in /Applications/Xcode_16*.app /Applications/Xcode.app /Applications/Xcode_15*.app; do
            if [ -d "$xc" ]; then
              echo "Checking $xc for iOS platform..."
              DEV_DIR="$xc/Contents/Developer"
              if "$DEV_DIR/usr/bin/xcodebuild" -version 2>/dev/null; then
                # Check if it has an iOS SDK or runtime
                if "$DEV_DIR/usr/bin/xcodebuild" -showsdks 2>/dev/null | grep -q "iOS"; then
                  echo "Found iOS SDK in $xc"
                  SELECTED_XCODE="$xc"
                  break
                fi
              fi
            fi
          done
          
          if [ -n "$SELECTED_XCODE" ]; then
            sudo xcode-select -s "$SELECTED_XCODE/Contents/Developer"
          elif [ -d "/Applications/Xcode_16.2.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer
          fi
          
          xcodebuild -version
          swift --version
          
          echo "=== Installed SDKs ==="
          xcodebuild -showsdks || true
          
          echo "=== Simctl Runtimes ==="
          xcrun simctl list runtimes || true

      - name: Setup xcbeautify
        run: |
          if ! command -v xcbeautify >/dev/null 2>&1; then
            brew install xcbeautify || true
          fi

      - name: Provision Firebase Configuration
        run: |
          chmod +x ./scripts/firebase/provision_firebase.sh
          sh ./scripts/firebase/provision_firebase.sh

      - name: Setup Build Credentials & Dirs
        run: |
          chmod +x ./scripts/setup_build_credentials.sh
          sh ./scripts/setup_build_credentials.sh "$(pwd)/build"

      - name: Cache SwiftPM Dependencies
        uses: actions/cache@v4
        with:
          path: |
            build/SourcePackages
            ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved', 'Keeper.xcodeproj/project.pbxproj') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Build Keeper (ARM64)
        run: |
          mkdir -p build/DerivedData
          mkdir -p build/SourcePackages
          touch build/build.log
          
          export CLONED_SOURCE_PACKAGES_DIR="$(pwd)/build/SourcePackages"
          export MODULE_CACHE_PATH="$HOME/Library/Developer/Xcode/DerivedData/ModuleCache.noindex"
          
          echo "Building Keeper with generic/platform=iOS Simulator..."
          set -o pipefail
          xcodebuild \
            -project Keeper.xcodeproj \
            -scheme Keeper \
            -configuration KeeperDebug \
            -destination 'generic/platform=iOS Simulator' \
            ARCHS=arm64 \
            CLANG_MODULE_CACHE_PATH="$MODULE_CACHE_PATH" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            -derivedDataPath build/DerivedData \
            -clonedSourcePackagesDirPath build/SourcePackages \
            build 2>&1 | tee build/build.log || {
              echo "=== BUILD FAILED. RECENT LOG OUTPUT: ==="
              tail -n 120 build/build.log
              echo "### Build Failed - Last Log Lines" >> $GITHUB_STEP_SUMMARY
              echo '```' >> $GITHUB_STEP_SUMMARY
              tail -n 80 build/build.log >> $GITHUB_STEP_SUMMARY
              echo '```' >> $GITHUB_STEP_SUMMARY
              exit 1
            }

      - name: Package .ipa
        run: |
          APP_PATH=$(find build/DerivedData -name "Keeper.app" -type d | head -n 1)
          echo "Found Keeper.app at: $APP_PATH"
          if [ -z "$APP_PATH" ] || [ ! -d "$APP_PATH" ]; then
            echo "ERROR: Keeper.app not found in DerivedData"
            exit 1
          fi
          mkdir -p build/Payload
          cp -R "$APP_PATH" build/Payload/
          cd build
          zip -r -9 Keeper.ipa Payload
          cd ..
          ls -lh build/Keeper.ipa

      - name: Upload Keeper .ipa Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Keeper-iOS-IPA
          path: build/Keeper.ipa
          if-no-files-found: error

      - name: Upload Build Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: build/build.log
          if-no-files-found: ignore
