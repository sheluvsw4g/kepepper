name: Build iOS IPA & Verify

on:
  push:
    branches: [main, master, 'release/**']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ipa:
    name: Build Keeper .ipa (macOS)
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Select Xcode Version
        run: |
          echo "Available Xcode installations:"
          ls -d /Applications/Xcode* || true
          
          # Prefer Xcode 16.2, 16.1 or highest available Xcode 16+
          if [ -d "/Applications/Xcode_16.3.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.3.app/Contents/Developer
          elif [ -d "/Applications/Xcode_16.2.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer
          elif [ -d "/Applications/Xcode_16.1.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.1.app/Contents/Developer
          elif [ -d "/Applications/Xcode_16.0.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.0.app/Contents/Developer
          elif [ -d "/Applications/Xcode.app" ]; then
            sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          fi
          
          xcodebuild -version
          swift --version

      - name: Setup xcbeautify
        run: |
          if ! command -v xcbeautify >/dev/null 2>&1; then
            brew install xcbeautify || true
          fi

      - name: Provision Firebase Configuration
        run: |
          chmod +x ./scripts/firebase/provision_firebase.sh
          sh ./scripts/firebase/provision_firebase.sh

      - name: Cache SwiftPM Dependencies
        uses: actions/cache@v4
        with:
          path: |
            build/SourcePackages
            ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved', 'Keeper.xcodeproj/project.pbxproj') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Build & Archive Keeper (iOS Device)
        run: |
          mkdir -p build/DerivedData
          mkdir -p build/SourcePackages
          mkdir -p build/Archive
          
          set -o pipefail
          xcodebuild \
            archive \
            -project Keeper.xcodeproj \
            -scheme Keeper \
            -configuration KeeperRelease \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            -archivePath build/Archive/Keeper.xcarchive \
            -derivedDataPath build/DerivedData \
            -clonedSourcePackagesDirPath build/SourcePackages \
            2>&1 | tee build/build.log | (xcbeautify || cat)

      - name: Package .ipa
        run: |
          mkdir -p build/Payload
          cp -r build/Archive/Keeper.xcarchive/Products/Applications/Keeper.app build/Payload/
          cd build
          zip -r -9 Keeper.ipa Payload
          cd ..
          ls -lh build/Keeper.ipa

      - name: Run Unit Tests
        continue-on-error: true
        run: |
          set -o pipefail
          SIMULATOR_ID=$(xcrun simctl list devices available | awk '/iPhone/ { last = $0; if (/Booted/) { print; found = 1; exit } } END { if (!found && last) print last }' | grep -oE '[0-9A-Fa-f-]{36}')
          echo "Selected simulator ID: $SIMULATOR_ID"
          
          if [ -n "$SIMULATOR_ID" ]; then
            xcodebuild \
              -project Keeper.xcodeproj \
              -scheme KeeperUnitTests \
              -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY="" \
              -derivedDataPath build/DerivedData \
              -clonedSourcePackagesDirPath build/SourcePackages \
              test 2>&1 | tee build/test.log | (xcbeautify || cat) || true
          fi

      - name: Upload Keeper .ipa Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Keeper-iOS-IPA
          path: build/Keeper.ipa
          if-no-files-found: error

      - name: Upload Build Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-and-test-logs
          path: |
            build/build.log
            build/test.log
          if-no-files-found: ignore
