name: Build iOS IPA & Verify

on:
  push:
    branches: [main, master, 'release/**']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ipa:
    name: Build Keeper .ipa (macOS)
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Select Xcode Version
        run: |
          echo "Available Xcode installations:"
          ls -d /Applications/Xcode* || true
          
          # Default on runner or explicit selection
          if [ -d "/Applications/Xcode_16.2.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer
          elif [ -d "/Applications/Xcode_16.1.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.1.app/Contents/Developer
          elif [ -d "/Applications/Xcode.app" ]; then
            sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          fi
          
          xcodebuild -version
          swift --version
          
          # Ensure simulator service is running and inspect available runtimes
          xcrun simctl list runtimes || true

      - name: Setup xcbeautify
        run: |
          if ! command -v xcbeautify >/dev/null 2>&1; then
            brew install xcbeautify || true
          fi

      - name: Provision Firebase Configuration
        run: |
          chmod +x ./scripts/firebase/provision_firebase.sh
          sh ./scripts/firebase/provision_firebase.sh

      - name: Setup Build Credentials & Dirs
        run: |
          chmod +x ./scripts/setup_build_credentials.sh
          sh ./scripts/setup_build_credentials.sh "$(pwd)/build"

      - name: Cache SwiftPM Dependencies
        uses: actions/cache@v4
        with:
          path: |
            build/SourcePackages
            ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved', 'Keeper.xcodeproj/project.pbxproj') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Build Keeper (ARM64)
        run: |
          mkdir -p build/DerivedData
          mkdir -p build/SourcePackages
          
          export CLONED_SOURCE_PACKAGES_DIR="$(pwd)/build/SourcePackages"
          
          # Find the first available iPhone simulator
          SIM_LINE=$(xcrun simctl list devices available | grep -E 'iPhone 16|iPhone 15|iPhone' | head -n 1)
          SIM_ID=$(echo "$SIM_LINE" | grep -oE '[0-9A-Fa-f-]{36}')
          echo "Selected Simulator Line: $SIM_LINE"
          echo "Selected Simulator ID: $SIM_ID"
          
          if [ -n "$SIM_ID" ]; then
            # Boot simulator so CoreSimulator registers it as active destination
            echo "Booting simulator $SIM_ID..."
            xcrun simctl boot "$SIM_ID" || true
            DEST="platform=iOS Simulator,id=$SIM_ID"
          else
            DEST="generic/platform=iOS Simulator"
          fi
          echo "Target destination: $DEST"
          
          set -o pipefail
          xcodebuild \
            -project Keeper.xcodeproj \
            -scheme Keeper \
            -configuration KeeperDebug \
            -destination "$DEST" \
            ARCHS=arm64 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            -derivedDataPath build/DerivedData \
            -clonedSourcePackagesDirPath build/SourcePackages \
            build 2>&1 | tee build/build.log | (xcbeautify || cat) || {
              echo "=== BUILD FAILED. RECENT LOG OUTPUT: ==="
              tail -n 120 build/build.log
              exit 1
            }

      - name: Package .ipa
        run: |
          APP_PATH=$(find build/DerivedData -name "Keeper.app" -type d | head -n 1)
          echo "Found Keeper.app at: $APP_PATH"
          if [ -z "$APP_PATH" ] || [ ! -d "$APP_PATH" ]; then
            echo "ERROR: Keeper.app not found in DerivedData"
            exit 1
          fi
          mkdir -p build/Payload
          cp -R "$APP_PATH" build/Payload/
          cd build
          zip -r -9 Keeper.ipa Payload
          cd ..
          ls -lh build/Keeper.ipa

      - name: Upload Keeper .ipa Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Keeper-iOS-IPA
          path: build/Keeper.ipa
          if-no-files-found: error

      - name: Upload Build Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: build/build.log
          if-no-files-found: ignore
